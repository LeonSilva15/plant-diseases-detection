name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -m "not model"

  model-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run model smoke test
        env:
          RUN_MODEL_SMOKE: "1"
        run: pytest -m model

  deploy-hugging-face:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Skip deployment when Hugging Face is not configured
        if: env.HF_TOKEN == '' || env.HF_SPACE == ''
        run: |
          echo "Set repository variable HF_SPACE, for example LeonSilva15/plant-diseases-detection."
          echo "Set repository secret HF_TOKEN with write access to the Space."

      - name: Deploy to Hugging Face Spaces
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          python -m pip install --upgrade huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import create_repo

          create_repo(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              space_sdk="gradio",
              exist_ok=True,
              token=os.environ["HF_TOKEN"],
          )
          PY
          huggingface-cli upload "$HF_SPACE" . . \
            --repo-type=space \
            --token "$HF_TOKEN" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".pytest_cache/*" \
            --exclude ".ruff_cache/*" \
            --exclude ".venv/*" \
            --exclude "__pycache__/*" \
            --exclude "dataset/*"
